# =============================================================
# Nginx config for Loadout SPA
# Handles client-side routing (React Router) by falling back
# all unknown paths to index.html
# =============================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Serve static assets directly with aggressive caching
    # Vite hashes filenames so stale cache is never an issue
    location ~* \.(?:js|css|woff2?|png|jpg|svg|ico|webp)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # PWA service worker — must not be cached
    location = /sw.js {
        expires     -1;
        add_header  Cache-Control "no-store, no-cache, must-revalidate";
        try_files   $uri =404;
    }

    # PWA manifest
    location = /manifest.webmanifest {
        expires     1d;
        add_header  Cache-Control "public";
        try_files   $uri =404;
    }

    # Health check endpoint (used by Docker / Azure health probe)
    location = /health {
        access_log  off;
        return      200 "ok\n";
        add_header  Content-Type text/plain;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files   $uri $uri/ /index.html;
        expires     -1;
        add_header  Cache-Control "no-store";
    }
}
